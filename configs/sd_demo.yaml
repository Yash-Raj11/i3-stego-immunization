# Preset for the Stable Diffusion before/after demo:   i3 demo PHOTO --owner ID --config configs/sd_demo.yaml
# Two-stage protection: 150 fast steps against TAESD (a small copy of the SD encoder, ~20 s on a Mac),
# then 20 refine steps against the REAL SD-1.x VAE (the slow part, roughly 10 s/step on a laptop GPU).
# Needs: pip install -e ".[sd]". Apple Silicon (MPS) or a CUDA GPU recommended.
# Faster: --refine-steps 10, or --refine-surrogate none (TAESD only). Stronger: --refine-steps 40.

surrogate: taesd          # stage 1 (fast)
refine_surrogate: sd-vae  # stage 2 (real Stable Diffusion VAE)
refine_steps: 20
models_dir: models
keys_dir: keys
max_side: 512             # SD-1.5 works natively at 512 px
device: auto

immunize:
  eps_255: 16
  chroma_ratio: 0.15
  steps: 150
  step_frac: 0.15
  momentum: 0.5
  eot_samples: 1
  psnr_min: 38.0
  face_psnr_min: 32.0     # a little more budget than the default (34) for a visible demo; try 30-34
  mode: untargeted        # also try: targeted  (compare with /i3-experiment --mode targeted,untargeted)
  payload_alpha: 0.005
  payload_lr: 0.0002
  payload_energy_slack: 1.1
  adv_floor: 0.0
  lambda_wm: 1.0
